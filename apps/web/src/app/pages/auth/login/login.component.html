<div class="auth-page">
  <app-auth-brand />

  <app-auth-card title="Sign in">
    @if (justRegistered) {
      <p-message severity="success" text="Account created. You can sign in now." />
    }
    @if (errorMessage(); as message) {
      <p-message severity="error" [text]="message" />
    }

    <form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" pInputText formControlName="email" placeholder="you@university.edu" />
        @if (showError('email')) {
          <small class="field-error">Enter a valid email address.</small>
        }
      </div>

      <div class="field">
        <label for="password">Password</label>
        <p-password inputId="password" formControlName="password" [feedback]="false" [toggleMask]="true" />
        @if (showError('password')) {
          <small class="field-error">Password is required.</small>
        }
        <a class="forgot-link" routerLink="/forgot-password">Forgot password?</a>
      </div>

      <p-button type="submit" label="Sign in" styleClass="auth-submit" [loading]="loading()" [disabled]="loading()" />
    </form>

    <p class="auth-footer">Dont have an account? please contact &#64;dlsud.edu.ph to receive a registration link</p>
  </app-auth-card>
</div>
