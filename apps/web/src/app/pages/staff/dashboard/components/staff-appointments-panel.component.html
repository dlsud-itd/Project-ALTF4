<!-- Upcoming appointments -->
<section class="appointments-panel" aria-labelledby="appointments-title">
  <div class="panel-header">
    <h3 id="appointments-title">
      <i class="pi pi-calendar"></i>
      Upcoming appointments
    </h3>
  </div>

  @if (isAppointmentsLoading()) {
    <app-loading-skeleton [lines]="3" />
  } @else if (hasAppointmentsError()) {
    <app-error-state
      title="Could not load appointments"
      message="Check your connection and try again."
      (retry)="onRetryAppointments()"
    />
  } @else if (!hasAppointments()) {
    <app-empty-state
      icon="pi-calendar"
      title="No upcoming appointments"
      message="Booked appointments will appear here."
    />
  } @else {
    <ul class="appointment-list">
      @for (row of appointments(); track row.id) {
        <li>
          <span class="appointment-name">{{ row.patientName }}</span>
          <div class="appointment-details">
            <span class="appointment-date">
              {{ row.clinicDate | date: dateFormat }}
            </span>
            <span class="appointment-time">{{
              appointmentTimeRange(row)
            }}</span>
          </div>
          <p-tag
            [value]="appointmentStatusLabel(row.status)"
            [severity]="appointmentStatusSeverity(row.status)"
          />
        </li>
      }
    </ul>
  }
</section>
