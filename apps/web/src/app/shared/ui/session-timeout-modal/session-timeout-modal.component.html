<p-dialog
  header="Session Expiring Soon"
  [visible]="timeoutService.isWarningVisible()"
  [modal]="true"
  [closable]="false"
  [closeOnEscape]="false"
  [draggable]="false"
  [resizable]="false"
  styleClass="session-timeout-dialog"
>
  <div class="timeout-modal-body">
    <div class="timeout-icon-wrapper" aria-hidden="true">
      <i class="pi pi-clock timeout-icon"></i>
    </div>

    <div class="timeout-text">
      <p class="timeout-lead">You have been inactive for a while.</p>
      <p class="timeout-message">
        For your security and privacy, your session will automatically end in:
      </p>
      <div class="countdown-badge" role="timer" aria-live="polite">
        <span class="countdown-digits">{{ timeoutService.secondsRemaining() }}</span>
        <span class="countdown-unit">seconds</span>
      </div>
    </div>

    <div class="dialog-actions">
      <p-button
        label="Sign Out"
        icon="pi pi-sign-out"
        severity="secondary"
        [outlined]="true"
        (onClick)="onSignOut()"
      />
      <p-button
        label="Stay Signed In"
        icon="pi pi-check"
        severity="primary"
        [autofocus]="true"
        (onClick)="onStaySignedIn()"
      />
    </div>
  </div>
</p-dialog>
